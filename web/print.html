<!DOCTYPE html>
<!--
  Printable A4 todo sheet. Standalone: no Flutter, just supabase-js, so it
  opens instantly and works from file:// too. Every load fetches fresh
  data straight from Supabase (same project and anon key as the app);
  sign-in is remembered by supabase-js in localStorage.

  Sections: "Hoje" (todos pinned with @today, and @daily/monthly ones
  due today), the top todos of each category in CATEGORY_SECTIONS, the
  remaining todos, and today's g1 Maranhão headlines filling whatever
  space the events leave (fetched through the `news` Edge Function,
  supabase/functions/news, since the feed has no CORS headers),
  upcoming events, and one box per person tagged with @nickname. The page
  is always exactly one A4 sheet: whatever doesn't fit is left out, and
  hiding an item (screen only, never saved) lets the next one in.

  Parsing mirrors lib/models/todo_card.dart, todo_tags.dart and
  todo_daily.dart (this page only reads: rolling a @daily todo over to
  today is written by the app).
  It is copied into build/web_chat by `flutter build web`, so it deploys
  with the web app as /print.html.
-->

<script>
'use strict';

const SUPABASE_URL = 'https://jixjuabvprbyupmaqtma.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppeGp1YWJ2cHJieXVwbWFxdG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTE1MDgsImV4cCI6MjA5NzIyNzUwOH0.RSCK1BMUSA_6M3THDOVnJQzP9RpcPspCL75R7UcBnbk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Categories that get their own section above "Tarefas", in this order,
// matched by name (case-insensitive). Each shows its first PER_CATEGORY
// todos; the rest of that category's todos fall through to "Tarefas".
// Categories not listed here only appear in "Tarefas".
const CATEGORY_SECTIONS = ['MVC', 'Tether', 'Levar', 'Casa'];
const PER_CATEGORY = 5;

// Today's headlines are shuffled and as many as fit fill the bottom of
// the right column; at most this many are considered.
const MAX_NEWS = 8;

const app = document.getElementById('app');

// --- Parsing (mirrors lib/models/todo_card.dart and todo_tags.dart) ---

// "@" not preceded by a word char (so e-mails don't match), then a handle
// that doesn't end in "." or "-".
const MENTION = /(?<![\p{L}\p{N}_@.])@([\p{L}\p{N}_.\-]*[\p{L}\p{N}_])/gu;
const TODAY_WORDS = new Set(['today', 'hoje']);

const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun',
                'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const WEEKDAYS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

/** Front matter (`---\ntype: event\n...\n---\n`) + body; see TodoCard. */
function parseCard(text) {
  const plain = { kind: 'todo', meta: {}, body: text };
  const normalized = text.replace(/\r\n/g, '\n');
  if (!normalized.startsWith('---\n')) return plain;
  const lines = normalized.split('\n');
  const close = lines.indexOf('---', 1);
  if (close < 0) return plain;
  const meta = {};
  for (const line of lines.slice(1, close)) {
    const colon = line.indexOf(':');
    if (colon <= 0) continue;
    let value = line.slice(colon + 1).trim();
    if (value.length >= 2 && /^(["']).*\1$/.test(value)) value = value.slice(1, -1);
    meta[line.slice(0, colon).trim()] = value;
  }
  const kind = meta.type;
  delete meta.type;
  if (kind !== 'move' && kind !== 'event') return plain;
  return { kind, meta, body: lines.slice(close + 1).join('\n') };
}

function handles(text) {
  const seen = new Set();
  const out = [];
  for (const m of text.matchAll(MENTION)) {
    const h = m[1].toLowerCase();
    if (TODAY_WORDS.has(h) || seen.has(h)) continue;
    seen.add(h);
    out.push(h);
  }
  return out;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-` +
         String(d.getDate()).padStart(2, '0');
}

function parseDate(value) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

// Latest occurrence on or before `today` of a repeating card (see
// TodoDaily.latestOccurrence): today for a daily one; for a monthly one
// its day this month or last, a day the month lacks falling on the 1st
// of the next.
function latestOccurrence(card, today) {
  if (card.meta.repeat !== 'monthly') return today;
  const day = Math.min(31, Math.max(1,
    parseInt(card.meta.monthday, 10) || parseDate(card.meta.date)?.getDate() || 1));
  const occ = (y, m) => day <= new Date(y, m + 1, 0).getDate()
    ? new Date(y, m, day) : new Date(y, m + 1, 1);
  const here = occ(today.getFullYear(), today.getMonth());
  return here > today ? occ(today.getFullYear(), today.getMonth() - 1) : here;
}

function validTime(value) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(value || '');
  if (!m || +m[1] > 23 || +m[2] > 59) return null;
  return `${m[1].padStart(2, '0')}:${m[2]}`;
}

// --- Rendering helpers ---

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

/** Inline markdown → HTML, with @mentions in bold. `drop` is a set of
 *  lower-cased handles to remove (the person whose box this is in). */
function inline(text, drop) {
  let s = text;
  if (drop) {
    s = s.replace(MENTION, (all, h) => drop.has(h.toLowerCase()) ? '' : all)
         .replace(/\s{2,}/g, ' ').trim();
  }
  s = esc(s)
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/__(.+?)__/g, '<b>$1</b>')
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<i>$2</i>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(MENTION, '<b>$&</b>');
  return s;
}

const CHECK = /^\s*[-*+] \[([ xX])\] ?(.*)$/;

/** A body as one main line plus up to a few sub-lines (checklists keep
 *  their boxes). */
function bodyParts(body) {
  const lines = body.split('\n').map(l => l.trimEnd()).filter(l => l.trim());
  const subs = lines.map(line => {
    const c = CHECK.exec(line);
    if (c) return { box: true, done: c[1] !== ' ', text: c[2] };
    return { box: false, done: false, text: line.replace(/^\s*(#+\s|[-*+]\s)/, '') };
  });
  return subs;
}

const MAX_SUBS = 4;

function subsHtml(subs, drop) {
  if (!subs.length) return '';
  const shown = subs.slice(0, MAX_SUBS);
  const rest = subs.length - shown.length;
  return '<ul class="sub">' + shown.map(s =>
    `<li>${s.box ? '<span class="box"></span>' : '<span>·</span>'}` +
    `<span class="${s.done ? 'done' : ''}">${inline(s.text, drop)}</span></li>`
  ).join('') + (rest > 0 ? `<li><span>…mais ${rest}</span></li>` : '') + '</ul>';
}

// --- State ---

const state = {
  user: null,
  ownerName: '',
  today: [],
  tasks: [],           // everything for the left column; see splitTasks()
  categories: [],      // CATEGORY_SECTIONS found: [{ key, name }]
  events: [],
  overdue: [],         // today's events whose start time already passed
  news: [],            // today's headlines, shuffled once per load
  people: [],          // [{ key, nickname, items }]
  byId: new Map(),     // id → item, for the hidden panel
  hidden: new Set(),   // ids hidden from this print only (never saved)
  limits: {},          // list key → how many items fit
  loadedAt: null,
};

// --- Data ---

async function load() {
  const uid = state.user.id;
  const [todosRes, contactsRes, profileRes, catsRes] = await Promise.all([
    sb.from('todos')
      .select('id, user_id, title, is_completed, completed_at, category_id, sort_order, ' +
              'created_at, assignee_ids, today_on')
      // Ticked @daily todos too (loose match): they may be due again.
      .or('is_completed.eq.false,title.like.*daily*,title.like.*monthly*')
      .eq('is_archived', false)
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: false }),
    sb.from('contacts').select('nickname, email, contact_user_id').eq('owner_id', uid),
    sb.from('profiles').select('display_name, email').eq('id', uid).maybeSingle(),
    sb.from('todo_categories').select('id, name').eq('user_id', uid),
  ]);
  for (const res of [todosRes, contactsRes, profileRes, catsRes]) {
    if (res.error) throw res.error;
  }

  // Only our own categories: a shared todo's category_id is its owner's,
  // so those always land in "Tarefas".
  const wanted = CATEGORY_SECTIONS.map(n => n.trim().toLowerCase());
  const catKeyById = new Map();
  state.categories = [];
  for (const name of wanted) {
    const cat = catsRes.data.find(c => c.name.trim().toLowerCase() === name);
    if (!cat) continue;
    catKeyById.set(cat.id, 'c:' + cat.id);
    state.categories.push({ key: 'c:' + cat.id, name: cat.name });
  }

  const contacts = contactsRes.data;
  const byNick = new Map(contacts.map(c => [c.nickname.toLowerCase(), c]));
  const byUser = new Map(contacts.filter(c => c.contact_user_id)
                                 .map(c => [c.contact_user_id, c]));
  const todayKey = dateKey(new Date());
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  state.ownerName = profileRes.data?.display_name || state.user.email;
  state.today = [];
  state.tasks = [];
  state.events = [];
  state.overdue = [];
  state.byId = new Map();
  const people = new Map();

  for (const row of todosRes.data) {
    const card = parseCard(row.title);
    let isToday = row.today_on === todayKey;
    const mine = row.user_id === uid;

    // @daily / monthly (see TodoDaily): once a newer occurrence is due
    // (an earlier day's, or today's from its start time), it counts as
    // today's, open and pinned, even before the app gets to write that.
    // Otherwise a ticked one is done for now. A postponed one shows as a
    // normal upcoming event.
    const repeat = card.kind === 'event' ? card.meta.repeat : null;
    const monthly = repeat === 'monthly';
    let dailyTime = null;
    if (repeat === 'daily' || monthly) {
      const date = parseDate(card.meta.date);
      const occurrence = latestOccurrence(card, midnight);
      dailyTime = validTime(card.meta.start) || '09:00';
      const [h, m] = dailyTime.split(':').map(Number);
      const due = occurrence < midnight ||
        now >= new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
      if (!date || date < occurrence) {
        if (due) isToday = true;
        else if (row.is_completed) continue;
      } else if (row.is_completed) {
        continue;
      }
      if (date && date > midnight) dailyTime = null;
    } else if (row.is_completed) {
      continue;
    }

    if (card.kind === 'event' && !dailyTime) {
      const date = parseDate(card.meta.date);
      if (date && date < midnight) continue;     // already happened
      const item = {
        id: row.id, kind: 'event', card, date,
        start: validTime(card.meta.start), end: validTime(card.meta.end),
        label: card.meta.title || bodyParts(card.body)[0]?.text || 'Evento',
      };
      // Today's events whose start time already went by are "atrasados".
      const startsAt = item.start && date && +date === +midnight
        ? new Date(date.getFullYear(), date.getMonth(), date.getDate(),
                   ...item.start.split(':').map(Number))
        : null;
      (startsAt && startsAt < now ? state.overdue : state.events).push(item);
      state.byId.set(row.id, item);
      continue;
    }

    let main, subs;
    if (dailyTime) {
      const parts = bodyParts(card.body);
      main = card.meta.title || parts.shift()?.text || '';
      subs = parts;
    } else if (card.kind === 'move') {
      main = `Levar: ${card.meta.from || '?'} → ${card.meta.to || '?'}`;
      subs = bodyParts(card.body);
    } else {
      const parts = bodyParts(card.body);
      main = parts[0]?.text ?? '';
      subs = parts.slice(1);
    }
    const item = {
      id: row.id, kind: card.kind, main, subs, isToday,
      repeat: !dailyTime ? null
        : monthly ? `todo mês, dia ${card.meta.monthday || parseDate(card.meta.date)?.getDate() || '?'}`
        : `todo dia ${dailyTime}`,
      catKey: catKeyById.get(row.category_id) ?? null,
      from: mine ? null : (byUser.get(row.user_id)?.nickname ?? 'compartilhada'),
    };
    state.byId.set(row.id, item);

    // Our own todos tagging someone go to that person's box instead of
    // our lists (one box per tagged person).
    const tagged = mine ? handles(row.title).filter(h => byNick.has(h)) : [];
    if (tagged.length) {
      for (const h of tagged) {
        if (!people.has(h)) {
          people.set(h, { key: 'p:' + h, nickname: byNick.get(h).nickname, items: [] });
        }
        people.get(h).items.push(item);
      }
    } else if (isToday) {
      state.today.push(item);
    } else {
      state.tasks.push(item);
    }
  }

  // "@today" first inside each box, then the list's own order.
  for (const p of people.values()) {
    p.items.sort((a, b) => (b.isToday ? 1 : 0) - (a.isToday ? 1 : 0));
  }
  state.people = [...people.values()]
    .sort((a, b) => a.nickname.localeCompare(b.nickname, 'pt-BR'));

  const byStart = (a, b) => {
    if (!a.date !== !b.date) return a.date ? -1 : 1;   // undated last
    if (a.date && b.date && +a.date !== +b.date) return a.date - b.date;
    return (a.start || '99').localeCompare(b.start || '99');
  };
  state.events.sort(byStart);
  state.overdue.sort(byStart);

  state.news = await loadNews();
  state.loadedAt = new Date();
}

/** Today's items from the g1 feed, shuffled. Never throws: without news
 *  the sheet just has no "Notícias" section. */
async function loadNews() {
  try {
    const { data, error } = await sb.functions.invoke('news');
    if (error) throw error;
    const xml = new DOMParser().parseFromString(String(data), 'application/xml');
    const todayKey = dateKey(new Date());
    const items = [];
    for (const el of xml.getElementsByTagName('item')) {
      const text = tag => el.getElementsByTagName(tag)[0]?.textContent.trim() ?? '';
      const date = new Date(text('pubDate'));
      if (isNaN(date) || dateKey(date) !== todayKey) continue;
      items.push({
        id: 'n:' + (text('guid') || text('link')),
        kind: 'news',
        label: text('title'),
        summary: text('atom:subtitle'),
        time: date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
      });
    }
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    const news = items.slice(0, MAX_NEWS);
    for (const n of news) state.byId.set(n.id, n);
    return news;
  } catch (err) {
    console.warn('Notícias indisponíveis:', err);
    return [];
  }
}

// --- Views ---

function itemHtml(item, drop) {
  const main = item.kind === 'move' ? esc(item.main) : inline(item.main, drop);
  const today = drop && item.isToday ? '<span class="tag-today">HOJE</span>' : '';
  const from = item.from ? ` <span class="from">· de ${esc(item.from)}</span>` : '';
  const repeat = item.repeat ? ` <span class="from">↻ ${esc(item.repeat)}</span>` : '';
  return `<li class="item">
    <span class="circle"></span>
    <div class="text">${main}${today}${repeat}${from}${subsHtml(item.subs, drop)}</div>
    <button class="hide-btn no-print" data-hide="${item.id}" title="Não imprimir">ocultar</button>
  </li>`;
}

function eventWhen(ev) {
  const parts = [];
  if (ev.date) {
    const today = new Date();
    const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.round((ev.date - midnight) / 86400000);
    parts.push(diff === 0 ? 'Hoje' : diff === 1 ? 'Amanhã'
      : `${WEEKDAYS[ev.date.getDay()]}, ${ev.date.getDate()} ${MONTHS[ev.date.getMonth()]}`);
  } else {
    parts.push('Sem data');
  }
  if (ev.start) parts.push(ev.end ? `${ev.start}–${ev.end}` : ev.start);
  return parts.join(' · ');
}

function eventHtml(ev) {
  const badge = ev.date
    ? `<div class="m">${MONTHS[ev.date.getMonth()].toUpperCase()}</div>
       <div class="d">${ev.date.getDate()}</div>`
    : '<div class="d">?</div>';
  const note = bodyParts(ev.card.body).filter(p => p.text !== ev.label)[0];
  return `<div class="event">
    <div class="badge">${badge}</div>
    <div>
      <div class="title">${inline(ev.label)}</div>
      <div class="when">${esc(eventWhen(ev))}</div>
      ${note ? `<div class="notes">${inline(note.text)}</div>` : ''}
    </div>
    <button class="hide-btn no-print" data-hide="${ev.id}" title="Não imprimir">ocultar</button>
  </div>`;
}

function newsHtml(n) {
  return `<div class="news">
    <div class="title">${esc(n.label)}</div>
    ${n.summary ? `<div class="summary">${esc(n.summary)}</div>` : ''}
    <div class="when">g1 Maranhão · ${esc(n.time)}</div>
    <button class="hide-btn no-print" data-hide="${esc(n.id)}" title="Não imprimir">ocultar</button>
  </div>`;
}

const visible = list => list.filter(i => !state.hidden.has(i.id));

/** The first `limit` visible items of a list, plus a screen-only note
 *  for what's left out. */
function take(key, list) {
  const items = visible(list);
  const limit = Math.min(state.limits[key] ?? Infinity, items.length);
  return { items: items.slice(0, limit), left: items.length - limit };
}

function moreHtml(left) {
  return left > 0
    ? `<div class="more no-print">+${left} não ${left === 1 ? 'coube' : 'couberam'} — oculte algo acima para dar lugar</div>`
    : '';
}

/** Splits the left column: each listed category takes its first
 *  PER_CATEGORY visible todos, everything else is "Tarefas". Worked out on
 *  every render, so hiding one of a category's todos pulls in its next
 *  one (out of "Tarefas"), and no todo shows up twice. */
function splitTasks() {
  const byCat = new Map(state.categories.map(c => [c.key, []]));
  const rest = [];
  for (const item of visible(state.tasks)) {
    const list = item.catKey && byCat.get(item.catKey);
    if (list && list.length < PER_CATEGORY) list.push(item);
    else rest.push(item);
  }
  return { byCat, rest };
}

function count(key) {
  if (key === 'today') return take('today', state.today).items.length;
  if (key === 'tasks') return take('tasks', splitTasks().rest).items.length;
  if (key === 'events') return take('events', state.events).items.length;
  if (key === 'overdue') return take('overdue', state.overdue).items.length;
  if (key === 'news') return take('news', state.news).items.length;
  if (key.startsWith('c:')) return take(key, splitTasks().byCat.get(key) ?? []).items.length;
  const p = state.people.find(p => p.key === key);
  return p ? take(key, p.items).items.length : 0;
}

function renderSheet() {
  const now = new Date();
  const weekday = now.toLocaleDateString('pt-BR', { weekday: 'long' });
  const day = now.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });

  const today = take('today', state.today);
  const split = splitTasks();
  const tasks = take('tasks', split.rest);
  const categories = state.categories
    .map(c => ({ c, ...take(c.key, split.byCat.get(c.key)) }))
    .filter(x => x.items.length || x.left);
  const events = take('events', state.events);
  const overdue = take('overdue', state.overdue);
  const news = take('news', state.news);
  const people = state.people
    .map(p => ({ p, ...take(p.key, p.items) }))
    .filter(x => x.items.length || x.left);

  const todayBody = today.items.length
    ? `<ul class="items">${today.items.map(i => itemHtml(i)).join('')}</ul>`
    : '<div class="write-in"></div><div class="write-in"></div>';

  const hiddenCount = state.hidden.size;
  const hiddenItems = [...state.hidden].map(id => state.byId.get(id)).filter(Boolean);

  app.innerHTML = `
    <div class="toolbar">
      <button class="btn primary" id="print">Imprimir</button>
      <button class="btn" id="reload">Atualizar</button>
      <button class="btn" id="unhide" ${hiddenCount ? '' : 'disabled'}>
        Mostrar ocultos${hiddenCount ? ` (${hiddenCount})` : ''}</button>
      <span class="spacer"></span>
      <span class="who">${esc(state.user.email)}</span>
      <button class="btn" id="signout">Sair</button>
    </div>
    ${hiddenItems.length ? `<div class="hidden-panel">
      <b>Ocultos nesta impressão</b> — nada muda no app.
      <ul>${hiddenItems.map(i => `<li><span>${esc(i.label || i.main)}</span>
        <button class="link" data-unhide="${i.id}">mostrar</button></li>`).join('')}</ul>
    </div>` : ''}
    <div class="sheet-wrap"><div class="page" id="page">
      <header class="page-header">
        <div>
          <h1>Afazeres</h1>
          <div class="owner">${esc(state.ownerName)}</div>
        </div>
        <div class="date">
          <div class="weekday">${esc(weekday)}</div>
          <div class="day">${esc(day)}</div>
        </div>
      </header>

      <section class="today-box">
        <h2 class="section-title">Hoje
          ${today.items.length ? `<span class="count">${today.items.length}</span>` : ''}</h2>
        ${todayBody}
        ${moreHtml(today.left)}
      </section>

      <div class="cols" id="cols">
        <div class="col" id="colLeft">
          ${categories.map(({ c, items, left }) => `<section class="category">
            <h2 class="section-title">${esc(c.name)}</h2>
            <ul class="items">${items.map(i => itemHtml(i)).join('')}</ul>
            ${moreHtml(left)}
          </section>`).join('')}
          <h2 class="section-title">Tarefas</h2>
          ${tasks.items.length
            ? `<ul class="items">${tasks.items.map(i => itemHtml(i)).join('')}</ul>`
            : '<div class="empty">Nada pendente.</div>'}
          ${moreHtml(tasks.left)}
        </div>
        <div class="col" id="colRight">
          ${overdue.items.length || overdue.left ? `<section class="category">
            <h2 class="section-title">Eventos atrasados</h2>
            ${overdue.items.map(eventHtml).join('')}
            ${moreHtml(overdue.left)}
          </section>` : ''}
          <h2 class="section-title">Próximos eventos</h2>
          ${events.items.length
            ? events.items.map(eventHtml).join('')
            : '<div class="empty">Nenhum evento marcado.</div>'}
          ${moreHtml(events.left)}
          ${news.items.length ? `<section class="news-section">
            <h2 class="section-title">Notícias</h2>
            ${news.items.map(newsHtml).join('')}
          </section>` : ''}
        </div>
      </div>

      ${people.length ? `<div class="people" id="people">
        ${people.map(({ p, items, left }) => {
          const drop = new Set([p.nickname.toLowerCase()]);
          return `<div class="person">
            <h3>${esc(p.nickname)}</h3>
            <ul class="items">${items.map(i => itemHtml(i, drop)).join('')}</ul>
            ${moreHtml(left)}
          </div>`;
        }).join('')}
      </div>` : ''}

      <footer class="page-footer">
        <span>Atualizado ${state.loadedAt.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>
        <span>Recettas</span>
      </footer>
    </div></div>`;

  scaleToScreen();
}

// --- One page, always: trim lists until everything fits ---

const MM = (() => {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;width:100mm';
  document.body.appendChild(probe);
  const px = probe.getBoundingClientRect().width / 100;
  probe.remove();
  return px;
})();

const overflows = el => el && el.scrollHeight > el.clientHeight + 1;

/** The list to lose its last item next, or null when the page fits. */
function nextToTrim() {
  const cols = document.getElementById('cols');
  const largestPerson = (min) => state.people
    .map(p => ({ key: p.key, n: count(p.key) }))
    .filter(x => x.n > min)
    .sort((a, b) => b.n - a.n)[0]?.key;

  // Today's pins and the person boxes size themselves; the two columns get
  // what's left, and need at least ~70mm to be worth printing.
  if (cols.clientHeight < 70 * MM) {
    return largestPerson(2) ?? (count('today') > 0 ? 'today' : null) ?? largestPerson(0);
  }
  if (overflows(document.getElementById('colLeft'))) {
    // General todos go first; then the category sections shrink, biggest
    // first, keeping one todo each for as long as possible.
    if (count('tasks') > 0) return 'tasks';
    const cats = state.categories
      .map(c => ({ key: c.key, n: count(c.key) }))
      .sort((a, b) => b.n - a.n);
    const victim = cats.find(x => x.n > 1) ?? cats.find(x => x.n > 0);
    if (victim) return victim.key;
  }
  if (overflows(document.getElementById('colRight'))) {
    // News only fills leftover space, so it goes before any event does.
    if (count('news') > 0) return 'news';
    if (count('overdue') > 0) return 'overdue';
    if (count('events') > 0) return 'events';
  }
  return null;
}

function fit() {
  state.limits = {};
  renderSheet();
  // Each pass drops one item; bounded so a bad layout can't hang the tab.
  for (let guard = 0; guard < 400; guard++) {
    const key = nextToTrim();
    if (!key) break;
    state.limits[key] = count(key) - 1;
    renderSheet();
  }
}

/** On narrow screens, shrink the preview to the viewport width. */
function scaleToScreen() {
  const page = document.getElementById('page');
  if (!page) return;
  page.style.transform = '';
  page.style.transformOrigin = '';
  const wrap = page.parentElement;
  wrap.style.height = '';
  const available = window.innerWidth - 16;
  const width = page.offsetWidth;
  if (width > available) {
    const k = available / width;
    page.style.transform = `scale(${k})`;
    page.style.transformOrigin = 'top left';
    page.style.marginLeft = '8px';
    wrap.style.height = `${page.offsetHeight * k + 40}px`;
  } else {
    page.style.marginLeft = '';
  }
}

// --- Events ---

app.addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.hide) {
    state.hidden.add(t.dataset.hide);
    fit();
  } else if (t.dataset.unhide) {
    state.hidden.delete(t.dataset.unhide);
    fit();
  } else if (t.id === 'unhide') {
    state.hidden.clear();
    fit();
  } else if (t.id === 'print') {
    window.print();
  } else if (t.id === 'reload') {
    await refresh();
  } else if (t.id === 'signout') {
    await sb.auth.signOut();
    showLogin();
  }
});

window.addEventListener('resize', scaleToScreen);
// Printing ignores the screen scale; put it back afterwards.
window.addEventListener('beforeprint', () => {
  const page = document.getElementById('page');
  if (page) { page.style.transform = ''; page.style.marginLeft = ''; }
});
window.addEventListener('afterprint', scaleToScreen);

async function refresh() {
  app.querySelector('#reload')?.setAttribute('disabled', '');
  try {
    await load();
    fit();
  } catch (err) {
    app.innerHTML = `<p class="status">Erro ao carregar: ${esc(err.message || String(err))}
      <br><br><button class="btn" onclick="location.reload()">Tentar de novo</button></p>`;
  }
}

function showLogin(message = '') {
  app.innerHTML = `
    <form class="login" id="login">
      <h1>Afazeres para imprimir</h1>
      <input name="email" type="email" placeholder="E-mail" autocomplete="username" required>
      <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <div class="error">${esc(message)}</div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>`;
  app.querySelector('#login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const { data, error } = await sb.auth.signInWithPassword({
      email: String(form.get('email')).trim(),
      password: String(form.get('password')),
    });
    if (error) return showLogin(error.message);
    state.user = data.user;
    app.innerHTML = '<p class="status">Carregando…</p>';
    await refresh();
  });
}

(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  state.user = data.session.user;
  await refresh();
})();
</script>
